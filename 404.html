        @keyframes roadAnimation {
            0% { background-position: 0 0; }

            <div class="car-icon" style="margin-top:12px; color:var(--primary); font-size:2.5rem;">

        <p style="font-size:1rem; color:var(--text-muted); line-height:1.7; margin-bottom:36px; max-width:460px; margin-left:auto; margin-right:auto;">
